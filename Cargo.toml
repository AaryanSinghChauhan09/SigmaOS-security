[package]
name = "sigmaos-security"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Security framework and sandboxing"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-security"
readme = "README.md"
keywords = ["security", "sandbox", "privilege"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
getrandom = "0.3"

[profile.release]
opt-level = 3
